icon: ':material-database:'

cit:
  mode: port
  port: 5432

build:
  architectures:
    - amd64
    - aarch64
  variants:
    - tag: "14-pkg-latest"
      pkg_name: postgresql14-server
      containerfile: Containerfile.pkg
      args:
        PG_VERSION: "14"
        BASE_VERSION: "15-latest"
      aliases: ["14"]
    - tag: "15-pkg-latest"
      pkg_name: postgresql15-server
      containerfile: Containerfile.pkg
      args:
        PG_VERSION: "15"
        BASE_VERSION: "15-latest"
      aliases: ["15"]
    - tag: "16-pkg-latest"
      pkg_name: postgresql16-server
      containerfile: Containerfile.pkg
      args:
        PG_VERSION: "16"
        BASE_VERSION: "15-latest"
      aliases: ["16"]
    - tag: "17-pkg-latest"
      pkg_name: postgresql17-server
      containerfile: Containerfile.pkg
      args:
        PG_VERSION: "17"
        BASE_VERSION: "15-latest"
      aliases: ["17"]
    - tag: "18-pkg-latest"
      pkg_name: postgresql18-server
      containerfile: Containerfile.pkg
      args:
        PG_VERSION: "18"
        BASE_VERSION: "15-latest"
      aliases: ["18", "latest", "pkg", "pkg-latest"]
      default: true
    # 19 is intentionally absent: postgresql19-server (19.b3) installs fine,
    # but the pgvector 0.8.2 port fails to compile against it -- PG19 moved the
    # core internals it relies on (LWLock, slock_t, ConditionVariable, Page,
    # AddinShmemInitLock) out of postgres.h's transitive includes. Re-add once
    # pgvector supports PG19 and 19.0 ships.
